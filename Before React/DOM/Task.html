<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM TASK</title>
  </head>
  <body>
    <div class="app">
      <h1>Task Manager</h1>

      <form id="taskForm">
        <input id="taskInput" placeholder="Enter a task" />
        <button type="submit">Add Task</button>
      </form>

      <p id="taskCount">Tasks: 0</p>

      <div>
        <h4>Task List</h4>
        <ul id="taskList"></ul>
      </div>
    </div>

    <script src="./task.js"></script>
  </body>
</html>
