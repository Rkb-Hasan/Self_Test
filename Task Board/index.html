<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Tracker - LocalStorage Practice</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>Task Board</h1>
        <form class="add-task-form">
          <input
            type="text"
            name="taskInput"
            placeholder="Enter a new task..."
            required
          />
          <button type="submit">+ Add Task</button>
        </form>
      </header>

      <!-- Main Container for Event Delegation -->
      <main class="board-container">
        <!-- Column: To Do -->
        <section class="column">
          <h2>To Do</h2>
          <ul class="task-list" id="todo-list" data-status="todo">
            <!-- Tasks dynamically injected here -->
          </ul>
        </section>

        <!-- Column: In Progress -->
        <section class="column">
          <h2>In Progress</h2>
          <ul class="task-list" id="in-progress-list" data-status="in-progress">
            <!-- Tasks dynamically injected here -->
          </ul>
        </section>

        <!-- Column: Done -->
        <section class="column">
          <h2>Done</h2>
          <ul class="task-list" id="done-list" data-status="done">
            <!-- Tasks dynamically injected here -->
          </ul>
        </section>
      </main>

      <footer>
        <button id="clear-all-btn" class="delete-btn">Clear All Tasks</button>
      </footer>
    </div>

    <script src="app.js"></script>
  </body>
</html>
